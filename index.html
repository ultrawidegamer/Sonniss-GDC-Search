<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonniss GDC Search</title>
    <style>
        :root {
            --background-color: hsl(210deg 50% 5%);
            --primary-color: hsl(250deg 70% 50%);
            --text-color: hsl(0deg 0% 90%);
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: grid;
            font-family: sans-serif;
            font-size: 16px;
            grid-template-rows: auto minmax(0, 1fr);
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        
        .titlebar {
            align-items: center;
            display: grid;
            grid-template-columns: 1fr 2fr 1fr;
            background-color: #542fda;
            height: 60px;
        }

        .filter {
            background-color: #c03a98;
        }

        .selected {
            background-color: #c05640;
        }

        .main {
            display: grid;
            grid-template-columns: minmax(200px, 1fr) minmax(400px, 3fr) minmax(200px, 1fr);
        }

        .results {
            display: grid;
            grid-template-rows: auto minmax(0, 1fr);
            overflow: hidden;
        }

        .content {
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        .content::-webkit-scrollbar {
            display: none;
        }

        .item, .columns {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            padding: 10px 0;
            width: 100%;
            border-bottom: 2px hsl(from var(--background-color) h calc(s - 20) calc(l + 10)) solid;
        }

        .item > *, .columns > * {
            display: grid;
            place-items: center;
        }

        .trackname {
            grid-column: span 2;
        }

        .item .text {
            width: 90%;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .columns .text {
            width: 90%;
        }

        .sentinel-top,
        .sentinel-bottom {
            height: 1px;
            width: 1px;
        }
    </style>
</head>
<body>
    <div class="titlebar">
        <div class="title"></div>
        <div class="search"></div>
        <div class="about"></div>
    </div>
    <div class="main">
        <div class="filter"></div>
        <div class="results">
            <div class="columns">
                <div class="trackname">
                    <div class="text">Track Name</div>
                </div>
                <div class="tracklibrary">
                    <div class="text">Library</div>
                </div>
                <div class="trackcreator">
                    <div class="text">Creator</div>
                </div>
            </div>
            <div class="content"></div>
        </div>
        <div class="selected"></div>
    </div>
    <script src="./js/main.js"></script>
</body>
</html>

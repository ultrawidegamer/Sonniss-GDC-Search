<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sonniss GDC Search</title>
    <style>
        :root {
            --background-color: #080f17;
            --primary-color: #542fda;
            --text-color: #e0e0e0;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            font-family: sans-serif;
            font-size: 20px;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }

        body, .main, .results, .list, .item {
            display: flex;
        }

        .content {
            overflow-y: auto;
            min-width: 100vw;
        }

        .sentinel-top,
        .sentinel-bottom {
            height: 1px;
            width: 1px;
        }

        .item {
            --line-height: 20px;
            box-sizing: border-box;
            line-height: var(--line-height);
            margin: 10px 0;
            max-height: calc(var(--line-height) * 3);
            overflow: hidden;
            width: 100%;
        }

        .item > * {
            flex: 1;
            margin: 1px 10px;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <div class="titlebar">
        <div class="title"></div>
        <div class="search"></div>
        <div class="about"></div>
    </div>
    <div class="main">
        <div class="filter"></div>
        <div class="results">
            <div class="top">
                <div class="count"></div>
            </div>
            <div class="list">
                <div class="columns"></div>
                <div class="content"></div>
            </div>
        </div>
        <div class="selected"></div>
    </div>
    <script src="./js/main.js"></script>
</body>
</html>

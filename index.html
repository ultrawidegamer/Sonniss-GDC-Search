<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./favicon.ico"/>
    <title>Sonniss GDC Search</title>
    <style>
        :root {
            --background-color: hsl(210deg 60% 5%);
            --primary-color: hsl(250deg 80% 60%);
            --text-color: hsl(0deg 0% 90%);
            --panel-background: hsl(from var(--background-color) h calc(s - 20) calc(l + 5));
            --panel-shadow: -2px 2px 10px hsl(from var(--background-color) h s calc(l - 5) / 50%);
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--background-color);
            color: var(--text-color);
            display: grid;
            font-family: sans-serif;
            font-size: 16px;
            grid-template-rows: auto minmax(0, 1fr);
            height: 100vh;
            margin: 0;
            overflow: hidden;
            padding: 10px;

        }

        .titlebar {
            display: grid;
            grid-template-columns: minmax(200px, 400px) minmax(400px, 1fr) 150px;
            align-items: center;
            background-color: var(--background-color);
            height: 60px;
            padding: 0 10px;
            margin-bottom: -5px;
            margin-top: -5px;

            .title {
                display: flex;
                align-items: center;
                margin-right: 10px;
                font-size: 1.2em;
                justify-content: center;
                user-select: none;
                cursor: pointer;

                > .text {
                    margin: 0 10px;
                }

                &:hover span {
                    animation: wave 1.2s ease-in-out infinite;
                }

                .soundwave {
                    display: flex;
                    align-items: center;
                    gap: 5px;
                    height: 50px;

                    span {
                        width: 5px;
                        background: var(--primary-color);
                        border-radius: 999px;
                        transform-origin: center;

                        &:nth-child(1) { height: 12px; animation-delay: -0.4s; }
                        &:nth-child(2) { height: 24px; animation-delay: -0.2s; }
                        &:nth-child(3) { height: 40px; animation-delay: 0s; }
                        &:nth-child(4) { height: 24px; animation-delay: -0.2s; }
                        &:nth-child(5) { height: 12px; animation-delay: -0.4s; }
                    }
                }
            }

            .search {
                position: relative;
                display: inline-block;
                box-shadow: var(--panel-shadow);
    
                > input {
                    width: 100%;
                    height: 100%;
                    padding: 12px 10px 12px 45px;
                    font-size: 16px;
                    border: none;
                    border-radius: 8px;
                    color: var(--text-color);
                    outline: 1px solid hsl(from var(--background-color) h calc(s - 20) calc(l + 10));
                    background-color: hsl(from var(--background-color) h calc(s - 20) calc(l + 5));

                    &::placeholder {
                        color: hsl(from var(--text-color) h s 40%);
                    }

                    &:focus-visible {
                        outline: 2px solid hsl(from var(--background-color) h calc(s - 10) calc(l + 30));
                    }
                }
    
                &::before {
                    content: "";
                    position: absolute;
                    left: 15px;
                    top: calc(50% - 2px);
                    width: 11px;
                    height: 11px;
                    border: 2px solid hsl(from var(--text-color) h s 40%);
                    border-radius: 50%;
                    transform: translateY(-50%);
                    pointer-events: none;
                }
                
                &::after {
                    content: "";
                    position: absolute;
                    left: 27px;
                    top: calc(50% + 2px);
                    width: 7px;
                    height: 2px;
                    background: hsl(from var(--text-color) h s 40%);
                    transform: rotate(45deg);
                    transform-origin: left center;
                    pointer-events: none;
                }
            }

            .about {
                &::details-content { 
                    width: 0; 
                    height: 0; 
                    overflow: hidden;    
                }
                
                &:open {
                    position: absolute;
                    top: 10px;
                    right: 11px;
                    background-color: var(--panel-background);
                    outline: 1px solid hsl(from var(--background-color) h calc(s - 20) calc(l + 10));
                    border-radius: 10px;
                    padding: 3px 9px;
                    box-shadow: var(--panel-shadow);
                    
                    &::details-content {
                        --width-multiplier: 2;
                        --width-speed: 100ms;
                        --height: 170px;
                        
                        transition: width var(--width-speed) ease, height calc(var(--width-speed) * var(--width-multiplier)) ease;
                        width: calc(var(--height) * var(--width-multiplier));
                        height: var(--height);
                    }

                    > summary {
                        margin-bottom: 0px;
                    }
                }
                
                > summary {
                    list-style: none;                  
                    user-select: none;
                    position: relative;
                    margin: 10px 0px;
                    text-align: center;
                    cursor: pointer;
                    display: flex;
                    justify-content: end;
                    align-items: center;
                    padding-right: 30px;  
                    
                    &::marker {
                        content: "";
                    }

                    &::before {
                        content: "?";
                        position: relative;
                        width: 20px;
                        height: 18px;
                        border: 2px solid var(--text-color);
                        border-radius: 50%;
                        transform: translateY(calc(-50% + 11px));
                        text-align: center;
                        padding-top: 2px;
                        margin-right: 10px;
                        color: var(--text-color);
                    }
                }

                > .info {
                    --secondary-text-color: hsl(from var(--text-color) h s calc(l - 30));
                    --secondary-text-color-hover: hsl(from var(--text-color) h s calc(l - 10));

                    display: flex;
                    flex-direction: column;
                    height: 100%;
                    justify-content: space-around;
                    padding: 5px;
                    font-size: 0.95em;
                    line-height: 1.4;

                    > .subtext {
                        font-size: 0.85em;
                    }

                    a {
                        color: var(--secondary-text-color);
                        text-decoration: underline;
                        text-underline-offset: 2px;
                        cursor: pointer;

                        &:hover {
                            color: var(--secondary-text-color-hover);
                        }
                    }

                    > .buttons {
                        display: flex;
                        justify-content: space-evenly;

                        button {
                            padding: 5px 10px;

                            color: var(--secondary-text-color);
                            font-size: 0.85em;
                            background: transparent;
                            border: 1px solid var(--secondary-text-color);
                            border-radius: 5px;
                            cursor: pointer;

                            &:hover {
                                color: var(--secondary-text-color-hover);
                                border-color: var(--secondary-text-color-hover);
                            }
                        }
                    }
                }
            }
        }
        
        .main {
            display: grid;
            
            .results {
                display: grid;
                grid-template-rows: auto minmax(0, 1fr);
                overflow: hidden;
                border-radius: 10px;
                margin-top: 8px;
                box-shadow: var(--panel-shadow);
                outline: 1px solid hsl(from var(--background-color) h calc(s - 20) calc(l + 10));

                :is(.item, .columns) {
                    display: grid;
                    grid-template-columns: 60px 1fr 1fr 1fr 1fr;
                    padding: 10px 0;
                    width: 100%;
                    border-bottom: 2px solid hsl(from var(--background-color) h calc(s - 20) calc(l + 10));
                    background: var(--panel-background);

                    & > * {
                        display: grid;
                        place-items: center;
                    }

                    .playstatespacer {
                        height: 20px;
                    }

                    .trackname {
                        grid-column: span 2;
                        place-items: initial;
                    }

                    .text {
                        width: 90%;
                        align-self: center;
                    }
                }

                .item {
                    .playstate.loading .playbutton, .playstate.playing .playbutton {
                        display: none;
                    }

                    .playstate.playing .pausebutton {
                        display: block;
                    }

                    .playstate.loading .loadingspinner {
                        display: block;
                    }

                    .playbutton {
                        width: 30px;
                        height: 30px;
                        border-radius: 50%;
                        border: 2px solid var(--primary-color);
                        position: relative;
                        margin: auto;

                        &::before {
                            content: "";
                            position: absolute;
                            left: 9px;
                            top: 5px;
                            border-top: 8px solid transparent;
                            border-bottom: 8px solid transparent;
                            border-left: 12px solid var(--primary-color);
                        }
                    }

                    .pausebutton {
                        display: none;
                        width: 30px;
                        height: 30px;
                        border-radius: 50%;
                        border: 2px solid var(--primary-color);
                        position: relative;
                        margin: auto;
                        
                        &::before,
                        &::after {
                            content: "";
                            position: absolute;
                            top: 6px;
                            width: 4px;
                            height: 14px;
                            background: var(--primary-color);
                            border-radius: 1px;
                        }
                        
                        &::before {
                            left: 7px;
                        }
                        
                        &::after {
                            right: 7px;
                        }
                    }

                    .loadingspinner {
                        display: none;
                        width: 30px;
                        height: 30px;
                        border-radius: 50%;
                        position: relative;
                        margin: auto;

                        &::before {
                            content: "";
                            position: absolute;
                            left: 2px;
                            top: 2px;
                            width: 20px;
                            height: 20px;
                            border: 3px solid rgba(255,255,255,0.2);
                            border-top-color: var(--primary-color);
                            border-radius: 50%;
                            animation: loading-spin 0.8s linear infinite;
                        }
                    }

                    .text {
                        white-space: nowrap;
                        overflow: hidden;
                        text-overflow: ellipsis;
                        align-self: center;
                    }

                    &:hover {
                        cursor: pointer;
                        background: hsl(from var(--panel-background) h s calc(l + 3));
                
                        .text {
                            color: hsl(from var(--text-color) h s calc(l - 10));
                        }

                        .playbutton {
                            border: 2px solid hsl(from var(--primary-color) h s calc(l - 3));

                            &::before {
                                border-left: solid 12px hsl(from var(--primary-color) h s calc(l - 3));
                            }
                        }
                    }
                }


                .content {
                    overflow-x: hidden;
                    width: 100%;
                    scrollbar-width: none;
                    -ms-overflow-style: none;

                    &::-webkit-scrollbar {
                        display: none;
                    }

                    .sentinel-top,
                    .sentinel-bottom {
                        height: 1px;
                        width: 1px;
                    }
                }
            }
        }

        .audio {
            --waveform-display: none;
            display: grid;
            justify-content: space-between;
            border-radius: 10px;
            padding: 0px;
            overflow: hidden;
            height: 0px;
            margin-top: 0px;
            transition: height 0.1s ease;
            background: var(--panel-background);
            grid-template-columns: minmax(200px, 400px) minmax(300px, 1000px) minmax(200px, 400px);
            gap: 8px;
            
            > .left {
                display: none;
                flex-direction: column;
                justify-content: space-around;
                
                :is(.name, .library, .creator) {
                    white-space: nowrap;
                    overflow: hidden;
                    text-overflow: ellipsis;
                }
            }
            
            > .center {
                display: none;
            }
            
            > .right {
                display: none;
                justify-content: end;
                align-items: center;
            }
            
            &.played {
                margin-top: 10px;
                height: 100px;
                padding: 10px 20px;
                box-shadow: var(--panel-shadow);
                outline: 1px solid hsl(from var(--background-color) h calc(s - 20) calc(l + 10));

                > .left {
                    display: flex;
                }

                > .center {
                    display: block;
                }

                > .right {
                    display: flex;
                }
            }

            &.playing {
                --waveform-display: block;
            }
            
            .waveform {
                width: 100%;
                position: relative;
                display: inline-block;
    
                > canvas {
                    display: block;
                    height: 30px;
                    width: 100%;
                }
    
                &::before {
                    content: "";
                    position: absolute;
                    top: 1px;
                    bottom: 1px;
                    left: var(--progress);
                    width: 2px;
                    background: hsl(from var(--text-color) h s calc(l - 15));;
                    border-radius: 999px;
                    transform: translateX(-50%);
                    display: var(--waveform-display);
                    pointer-events: none;
                }
            }

            .download {
                padding: 20px;
                cursor: pointer;

                .icon {
                    --line-size: 3px;
                    position: relative;
                    width: 40px;
                    height: 15px;
                    border: var(--line-size) solid var(--text-color);
                    border-top: none;
                    border-radius: 0 0 var(--line-size) var(--line-size);
                    margin-top: 15px;
                    cursor: pointer;

                    &::before,
                    &::after {
                        content: "";
                        position: absolute;
                        transform: translateX(-50%);
                    }

                    &::before {
                        left: 50%;
                        top: -21px;
                        width: var(--line-size);
                        height: 22px;
                        background: var(--text-color);
                    }

                    &::after {
                        left: calc(50% - 3px);
                        top: -11px;
                        width: 15px;
                        height: 15px;
                        border-right: var(--line-size) solid var(--text-color);
                        border-bottom: var(--line-size) solid var(--text-color);
                        rotate: 45deg;
                    }
                }
            }

            .menu {
                padding: 37px;
                cursor: pointer;

                .icon {
                    position: relative;
                    width: 5px;
                    height: 5px;
                    border-radius: 50%;
                    background-color: var(--text-color);

                    &::before,
                    &::after {
                        content: "";
                        position: absolute;
                        left: 0;
                        width: 5px;
                        height: 5px;
                        border-radius: 50%;
                        background-color: var(--text-color);
                    }
                    
                    &::before {
                        top: -12px;
                    }
            
                    &::after {
                        top: 12px;
                    }
                }
            }
        }


        @keyframes loading-spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes wave {
            0%, 100% {
                transform: scaleY(0.8);
            }
            50% {
                transform: scaleY(1.1);
            }
        }
    </style>
</head>
<body role="main">
    <div class="titlebar">
        <div class="title">
            <div class="soundwave">
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
            </div>
            <div class="text">Sonniss GDC Search</div>
        </div>
        <div class="search">
            <input placeholder="Search sounds by name, tag, library or creator..."/>
        </div>
        <details class="about">
            <summary>About</summary>
            <div class="info">
            <div class="text">Unofficial website for browsing the Sonniss GDC audio bundles</div>
            <a href="https://github.com/ultrawidegamer" target="_blank">
                Created by ultrawidegamer
            </a>
            <div>
                Audio files are hosted by the
                <a href="https://archive.org/details/@ultrawide_gamer?query=gdc+sonniss&sort=-title" target="_blank">
                    Internet Archive
                </a>
            </div>
            <div class="buttons">
                <button onclick="window.open('https://github.com/ultrawidegamer/Sonniss-GDC-Search', '_blank')">
                    GitHub Repo
                </button>
                <button onclick="window.open('https://gdc.sonniss.com', '_blank')">
                    Sonniss GDC
                </button>
            </div>
            </div>
        </div>
    </div>
    <div class="main">
        <div class="results">
            <div class="columns">
                <div class="playstatespacer"></div>
                <div class="trackname">
                    <div class="text">Track Name</div>
                </div>
                <div class="tracklibrary">
                    <div class="text">Library</div>
                </div>
                <div class="trackcreator">
                    <div class="text">Creator</div>
                </div>
            </div>
            <div class="content"></div>
        </div>
    </div>
    <div class="audio">
        <div class="left">
            <div class="name">AEROJet Blast Off Clean 344 Audio Air Designed</div>
            <div class="library">Air Designed</div>
            <div class="creator">344 Audio</div>
        </div>
        <div class="center">
            <div class="waveform">
                <canvas width="600" height="100"></canvas>
                <div class="playback">
                    <audio></audio>
                </div>
            </div>
        </div>
        <div class="right">
            <a class="download" target="_blank">
                <div class="icon"></div>
            </a>
            <div class="menu">
                <div class="icon"></div>
            </div>
        </div>
    </div>
    <script defer src="./js/main.js"></script>
</body>
</html>
